<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --black: #000000;
    --surface: #0d0d0d;
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.45);
  }
  html { background: var(--black); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 52px;
    background: rgba(0,0,0,0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-weight: 600; font-size: 12px; letter-spacing: -0.01em; line-height: 1.25; color: var(--text); text-decoration: none; }
  .nav-links { display: flex; gap: 40px; align-items: center; }
  .nav-link { font-size: 11px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .nav-link:hover, .nav-link.active { color: var(--text); }
  .nav-cta { font-size: 11px; font-weight: 600; letter-spacing: -0.01em; color: var(--black); background: var(--text); padding: 7px 16px; text-decoration: none; transition: opacity 0.2s; }
  .nav-cta:hover { opacity: 0.8; }

  .about-section { padding: 130px 36px 60px; max-width: 580px; }
  .hero-label { font-size: 10px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted); margin-bottom: 18px; }
  .about-section h1 { font-weight: 600; font-size: 60px; letter-spacing: -0.04em; margin-bottom: 24px; line-height: 0.95; }
  .about-section p { font-size: 15px; font-weight: 600; line-height: 1.85; color: #ffffff; margin-bottom: 16px; }

  .shop-cta-wrap { padding: 0 36px 60px; }
  .shop-cta { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: -0.01em; color: var(--black); background: var(--text); padding: 13px 28px; text-decoration: none; transition: opacity 0.2s; }
  .shop-cta:hover { opacity: 0.8; }

  .contact-wrap { padding: 0 36px 100px; max-width: 580px; }
  .contact-label { font-size: 10px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted); margin-bottom: 18px; border-top: 1px solid var(--border); padding-top: 48px; }
  .contact-wrap h3 { font-weight: 600; font-size: 40px; letter-spacing: -0.03em; margin-bottom: 32px; line-height: 0.95; }
  .c-form { display: flex; flex-direction: column; gap: 12px; }
  .c-input, .c-textarea { background: var(--surface); border: 1px solid var(--border); color: #ffffff; font-family: inherit; font-size: 13px; letter-spacing: -0.01em; padding: 13px 16px; width: 100%; outline: none; transition: border-color 0.2s; border-radius: 0; }
  .c-input::placeholder, .c-textarea::placeholder { color: rgba(255,255,255,0.25); }
  .c-input:focus, .c-textarea:focus { border-color: rgba(255,255,255,0.25); }
  .c-textarea { resize: vertical; min-height: 120px; }
  .c-submit { background: #ffffff; color: var(--black); border: none; padding: 14px 32px; font-size: 11px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; font-family: inherit; transition: opacity 0.2s; margin-top: 8px; }
  .c-submit:hover { opacity: 0.8; }
  .c-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .c-success { display: none; font-size: 13px; color: #ffffff; padding-top: 24px; letter-spacing: -0.01em; }
  .c-success.show { display: block; }

  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .nav-links { gap: 16px; }
    .nav-cta { display: none; }
    .about-section { padding: 90px 20px 40px; }
    .about-section h1 { font-size: 42px; }
    .shop-cta-wrap { padding: 0 20px 48px; }
    .contact-wrap { padding: 0 20px 80px; }
    .contact-wrap h3 { font-size: 32px; }
    .c-input, .c-textarea { font-size: 16px; } /* prevent iOS zoom */
  }
  footer { padding: 40px 36px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); }
  .footer-logo { width: 72px; height: auto; display: block; }
  .footer-year { font-size: 11px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted); }
  @media (max-width: 768px) { footer { padding: 28px 20px; } .footer-logo { width: 56px; } }

<body>
<nav>
  <a class="nav-logo" href="index.html">Stone Rock<br>Studios</a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Work</a>
    <a class="nav-link active" href="about.html">About</a>
    <a class="nav-link" href="shop.html">Shop</a>
    <a class="nav-cta" href="#contact">Get in Touch</a>
  </div>
</nav>

<div class="about-section">
  <div class="hero-label">About</div>
  <h1>Stone Rock<br>Studios</h1>
  <p>The funniest production studio in the world.</p>
</div>

<div class="shop-cta-wrap">
  <a class="shop-cta" href="shop.html">Shop the Collection →</a>
</div>

<div class="contact-wrap" id="contact">
  <div class="contact-label">Contact</div>
  <h3>Get in Touch</h3>
  <form class="c-form" id="contactForm" action="https://formspree.io/f/mwvdoqdb" method="POST">
    <input class="c-input" type="text" name="name" placeholder="Name" required>
    <input class="c-input" type="email" name="email" placeholder="Email" required>
    <textarea class="c-textarea" name="message" placeholder="Tell us about your project" required></textarea>
    <button class="c-submit" type="submit">Send Message</button>
  </form>
  <div class="c-success" id="contactSuccess">Thanks — we'll be in touch soon.</div>
</div>

<script>
document.querySelector('.shop-cta').addEventListener('click', () => {
  gtag('event', 'select_promotion', { promotion_name: 'about_shop_cta', promotion_id: 'about_to_shop' });
});

const form = document.getElementById('contactForm');
const success = document.getElementById('contactSuccess');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = form.querySelector('.c-submit');
  btn.textContent = 'Sending…'; btn.disabled = true;
  try {
    const res = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
    if (res.ok) {
      form.style.display = 'none';
      success.classList.add('show');
      gtag('event', 'generate_lead', { form_location: 'about' });
      fbq('track', 'Lead');
    } else { btn.textContent = 'Error — try again'; btn.disabled = false; }
  } catch { btn.textContent = 'Error — try again'; btn.disabled = false; }
});
</script>
<footer>
  <img src="footer-logo.png" alt="Stone Rock Studios" class="footer-logo">
  <span class="footer-year">2026</span>
</footer>
</body>
